<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#294a40"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1200" height="870" fill="#f0eee9"/><text x="42" y="40" font-size="18" fill="#294a40">AVELINE / SPATIAL DESIGN</text><text x="42" y="98" font-size="36" fill="#111614">关卡流程：五段认知变化</text><rect x="42" y="148" width="58" height="48" fill="#dce66a"/><text x="52" y="181" font-size="25" fill="#111614">01</text><text x="122" y="178" font-size="27" fill="#294a40">01 / 00:00–02:31</text><text x="122" y="218" font-size="23" fill="#111614">入场与任务 → 建立行动动机，准备进入异常空间。</text><rect x="42" y="280" width="58" height="48" fill="#dce66a"/><text x="52" y="313" font-size="25" fill="#111614">02</text><text x="122" y="310" font-size="27" fill="#294a40">02 / 02:31–05:53</text><text x="122" y="350" font-size="23" fill="#111614">倒悬初见、换面、斜坡 → 看目标，理解新的行走面。</text><rect x="42" y="412" width="58" height="48" fill="#dce66a"/><text x="52" y="445" font-size="25" fill="#111614">03</text><text x="122" y="442" font-size="27" fill="#294a40">03 / 05:53–09:25</text><text x="122" y="482" font-size="23" fill="#111614">局部重力场、大厅首访 → 将对象运动用于连接判断。</text><rect x="42" y="544" width="58" height="48" fill="#dce66a"/><text x="52" y="577" font-size="25" fill="#111614">04</text><text x="122" y="574" font-size="27" fill="#294a40">04 / 09:25–19:22</text><text x="122" y="614" font-size="23" fill="#111614">外围探索、机制迁移、重访 → 在新朝向识别旧结构。</text><rect x="42" y="676" width="58" height="48" fill="#dce66a"/><text x="52" y="709" font-size="25" fill="#111614">05</text><text x="122" y="706" font-size="27" fill="#294a40">05 / 19:22–20:45</text><text x="122" y="746" font-size="23" fill="#111614">信标、组合通路、抵达晶体 → 汇合已学规则，收束目标。</text><rect x="42" y="812" width="1116" height="1" fill="#b4b9ad"/><text x="42" y="845" font-size="18" fill="#294a40">2026-10-15 分析图 · 历史资料与设计意图，非测绘 / 非游戏内提示</text></g></svg>
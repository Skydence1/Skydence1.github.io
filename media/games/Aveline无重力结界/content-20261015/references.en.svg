<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="738" viewBox="0 0 1200 738"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#294a40"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1200" height="738" fill="#f0eee9"/><text x="42" y="40" font-size="18" fill="#294a40">AVELINE / SPATIAL DESIGN</text><text x="42" y="98" font-size="36" fill="#111614">References → spatial questions</text><rect x="42" y="148" width="58" height="48" fill="#dce66a"/><text x="52" y="181" font-size="25" fill="#111614">01</text><text x="122" y="178" font-size="27" fill="#294a40">Control / Remedy</text><text x="122" y="218" font-size="23" fill="#111614">Institutional order + anomaly → repeat structures, then change their spatial</text><text x="122" y="253" font-size="23" fill="#111614">reading.</text><rect x="42" y="280" width="58" height="48" fill="#dce66a"/><text x="52" y="313" font-size="25" fill="#111614">02</text><text x="122" y="310" font-size="27" fill="#294a40">Wuthering Waves · Avinoleum / Kuro</text><text x="122" y="350" font-size="23" fill="#111614">Gravity traversal → reveal connections before switching; retain orientation cues</text><text x="122" y="385" font-size="23" fill="#111614">after.</text><rect x="42" y="412" width="58" height="48" fill="#dce66a"/><text x="52" y="445" font-size="25" fill="#111614">03</text><text x="122" y="442" font-size="27" fill="#294a40">Brutalist architecture · mass and structure</text><text x="122" y="482" font-size="23" fill="#111614">Architectural vocabulary → compressed entrances, central mass, beams and fans as</text><text x="122" y="517" font-size="23" fill="#111614">cues.</text><rect x="42" y="544" width="58" height="48" fill="#dce66a"/><text x="52" y="577" font-size="25" fill="#111614">04</text><text x="122" y="574" font-size="27" fill="#294a40">Sources and scope</text><text x="122" y="614" font-size="23" fill="#111614">Project design document (2026-10-14), reference research. Text analysis; no</text><text x="122" y="649" font-size="23" fill="#111614">reference-game artwork reproduced.</text><rect x="42" y="680" width="1116" height="1" fill="#b4b9ad"/><text x="42" y="713" font-size="18" fill="#294a40">Analysis 2026-10-15 · Archive + design intent; not a survey or in-game UI</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="738" viewBox="0 0 1200 738"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#294a40"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1200" height="738" fill="#f0eee9"/><text x="42" y="40" font-size="18" fill="#294a40">AVELINE / SPATIAL DESIGN</text><text x="42" y="98" font-size="36" fill="#111614">Activity rhythm: manage information density</text><rect x="42" y="148" width="58" height="48" fill="#dce66a"/><text x="52" y="181" font-size="25" fill="#111614">01</text><text x="122" y="178" font-size="27" fill="#294a40">Reveal / observe</text><text x="122" y="218" font-size="23" fill="#111614">Provide a pause; establish the distant goal, then locate the next exit.</text><rect x="42" y="280" width="58" height="48" fill="#dce66a"/><text x="52" y="313" font-size="25" fill="#111614">02</text><text x="122" y="310" font-size="27" fill="#294a40">Switch / experiment</text><text x="122" y="350" font-size="23" fill="#111614">Intended order: fixed connection → landing confirmation → portable choice.</text><rect x="42" y="412" width="58" height="48" fill="#dce66a"/><text x="52" y="445" font-size="25" fill="#111614">03</text><text x="122" y="442" font-size="27" fill="#294a40">Perimeter / apply</text><text x="122" y="482" font-size="23" fill="#111614">Combine learned rules; archive combat competes for attention and needs reduction.</text><rect x="42" y="544" width="58" height="48" fill="#dce66a"/><text x="52" y="577" font-size="25" fill="#111614">04</text><text x="122" y="574" font-size="27" fill="#294a40">Revisit / reorient</text><text x="122" y="614" font-size="23" fill="#111614">Use shared landmarks to confirm progress, then offer the next goal. Intended</text><text x="122" y="649" font-size="23" fill="#111614">rhythm, not measured stress.</text><rect x="42" y="680" width="1116" height="1" fill="#b4b9ad"/><text x="42" y="713" font-size="18" fill="#294a40">Analysis 2026-10-15 · Archive + design intent; not a survey or in-game UI</text></g></svg>
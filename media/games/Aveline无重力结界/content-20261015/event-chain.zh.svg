<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="738" viewBox="0 0 1200 738"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#294a40"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1200" height="738" fill="#f0eee9"/><text x="42" y="40" font-size="18" fill="#294a40">AVELINE / SPATIAL DESIGN</text><text x="42" y="98" font-size="36" fill="#111614">道路形成：条件 → 反馈 → 行动</text><rect x="42" y="148" width="58" height="48" fill="#dce66a"/><text x="52" y="181" font-size="25" fill="#111614">01</text><text x="122" y="178" font-size="27" fill="#294a40">条件 / 接近下一段</text><text x="122" y="218" font-size="23" fill="#111614">角色接近触发区域；具体区域以当前功能Actor为准。</text><rect x="42" y="280" width="58" height="48" fill="#dce66a"/><text x="52" y="313" font-size="25" fill="#111614">02</text><text x="122" y="310" font-size="27" fill="#294a40">事件 / 前方道路形成</text><text x="122" y="350" font-size="23" fill="#111614">路块运动改变前方空间；镜头应保留前进方向与目标。</text><rect x="42" y="412" width="58" height="48" fill="#dce66a"/><text x="52" y="445" font-size="25" fill="#111614">03</text><text x="122" y="442" font-size="27" fill="#294a40">反馈 / 通路可辨认</text><text x="122" y="482" font-size="23" fill="#111614">玩家看到连接建立，再决定继续前进；不能只在后台改变状态。</text><rect x="42" y="544" width="58" height="48" fill="#dce66a"/><text x="52" y="577" font-size="25" fill="#111614">04</text><text x="122" y="574" font-size="27" fill="#294a40">验证 / 旧片与新配置分开</text><text x="122" y="614" font-size="23" fill="#111614">旧片20:10–20:34；10月14日四块尾段的正式角色验证另见道路报告。</text><rect x="42" y="680" width="1116" height="1" fill="#b4b9ad"/><text x="42" y="713" font-size="18" fill="#294a40">2026-10-15 分析图 · 历史资料与设计意图，非测绘 / 非游戏内提示</text></g></svg>
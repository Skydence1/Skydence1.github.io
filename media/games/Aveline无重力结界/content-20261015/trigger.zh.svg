<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="738" viewBox="0 0 1200 738"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#294a40"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1200" height="738" fill="#f0eee9"/><text x="42" y="40" font-size="18" fill="#294a40">AVELINE / SPATIAL DESIGN</text><text x="42" y="98" font-size="36" fill="#111614">门：让角色行动成为触发依据</text><rect x="42" y="148" width="58" height="48" fill="#dce66a"/><text x="52" y="181" font-size="25" fill="#111614">01</text><text x="122" y="178" font-size="27" fill="#294a40">问题 · 交互范围过早碰到触发区</text><text x="122" y="218" font-size="23" fill="#111614">大范围交互球可能先于角色身体到达；开门结果与玩家位置脱节。</text><rect x="42" y="280" width="58" height="48" fill="#dce66a"/><text x="52" y="313" font-size="25" fill="#111614">02</text><text x="122" y="310" font-size="27" fill="#294a40">修正 · 普通门过滤重叠组件</text><text x="122" y="350" font-size="23" fill="#111614">角色胶囊进入 → 门开启；排除交互球。NPC演出逻辑单独检查。</text><rect x="42" y="412" width="58" height="48" fill="#dce66a"/><text x="52" y="445" font-size="25" fill="#111614">03</text><text x="122" y="442" font-size="27" fill="#294a40">已有证据 · 10月14日局部检查</text><text x="122" y="482" font-size="23" fill="#111614">正式角色往返、停步、离开关门；详见门胶囊触发报告。</text><rect x="42" y="544" width="58" height="48" fill="#dce66a"/><text x="52" y="577" font-size="25" fill="#111614">04</text><text x="122" y="574" font-size="27" fill="#294a40">未验证 · 玩家是否理解原因</text><text x="122" y="614" font-size="23" fill="#111614">单独重叠窗口和首次体验理解不由这组技术检查代替。</text><rect x="42" y="680" width="1116" height="1" fill="#b4b9ad"/><text x="42" y="713" font-size="18" fill="#294a40">2026-10-15 分析图 · 历史资料与设计意图，非测绘 / 非游戏内提示</text></g></svg>
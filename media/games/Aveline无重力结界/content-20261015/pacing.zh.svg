<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="738" viewBox="0 0 1200 738"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#294a40"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1200" height="738" fill="#f0eee9"/><text x="42" y="40" font-size="18" fill="#294a40">AVELINE / SPATIAL DESIGN</text><text x="42" y="98" font-size="36" fill="#111614">活动节奏：控制信息密度</text><rect x="42" y="148" width="58" height="48" fill="#dce66a"/><text x="52" y="181" font-size="25" fill="#111614">01</text><text x="122" y="178" font-size="27" fill="#294a40">初见 / 观察</text><text x="122" y="218" font-size="23" fill="#111614">提供停留位置，先交代远景目标，再寻找局部出口。</text><rect x="42" y="280" width="58" height="48" fill="#dce66a"/><text x="52" y="313" font-size="25" fill="#111614">02</text><text x="122" y="310" font-size="27" fill="#294a40">换面 / 尝试</text><text x="122" y="350" font-size="23" fill="#111614">理想顺序：固定连接 → 确认落点 → 再引入搬运选择。</text><rect x="42" y="412" width="58" height="48" fill="#dce66a"/><text x="52" y="445" font-size="25" fill="#111614">03</text><text x="122" y="442" font-size="27" fill="#294a40">外围 / 应用</text><text x="122" y="482" font-size="23" fill="#111614">组合已学规则；旧版战斗会争夺注意力，需要删减与重排。</text><rect x="42" y="544" width="58" height="48" fill="#dce66a"/><text x="52" y="577" font-size="25" fill="#111614">04</text><text x="122" y="574" font-size="27" fill="#294a40">回环 / 恢复方向</text><text x="122" y="614" font-size="23" fill="#111614">用共同地标识别进度，再给下一步目标。此图是设计意图，不是压力实测曲线。</text><rect x="42" y="680" width="1116" height="1" fill="#b4b9ad"/><text x="42" y="713" font-size="18" fill="#294a40">2026-10-15 分析图 · 历史资料与设计意图，非测绘 / 非游戏内提示</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="738" viewBox="0 0 1200 738"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#294a40"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1200" height="738" fill="#f0eee9"/><text x="42" y="40" font-size="18" fill="#294a40">AVELINE / SPATIAL DESIGN</text><text x="42" y="98" font-size="36" fill="#111614">参考转译：把风格变成空间问题</text><rect x="42" y="148" width="58" height="48" fill="#dce66a"/><text x="52" y="181" font-size="25" fill="#111614">01</text><text x="122" y="178" font-size="27" fill="#294a40">Control / Remedy</text><text x="122" y="218" font-size="23" fill="#111614">机构秩序与异常并置 → 用重复结构建立记忆，再以换面改变理解。</text><rect x="42" y="280" width="58" height="48" fill="#dce66a"/><text x="52" y="313" font-size="25" fill="#111614">02</text><text x="122" y="310" font-size="27" fill="#294a40">鸣潮 · 阿维纽林 / 库洛</text><text x="122" y="350" font-size="23" fill="#111614">重力体验 → 换面之前看见连接，换面之后保留定位线索。</text><rect x="42" y="412" width="58" height="48" fill="#dce66a"/><text x="52" y="445" font-size="25" fill="#111614">03</text><text x="122" y="442" font-size="27" fill="#294a40">粗野主义建筑 · 体块与裸露结构</text><text x="122" y="482" font-size="23" fill="#111614">建筑语汇 → 收束入口、放大中央巨构、用梁与风扇建立识别点。</text><rect x="42" y="544" width="58" height="48" fill="#dce66a"/><text x="52" y="577" font-size="25" fill="#111614">04</text><text x="122" y="574" font-size="27" fill="#294a40">资料来源与使用边界</text><text x="122" y="614" font-size="23" fill="#111614">项目设计说明文档（2026-10-14），参考研究章节；此板为文字分析，未复用参考作品图片。</text><rect x="42" y="680" width="1116" height="1" fill="#b4b9ad"/><text x="42" y="713" font-size="18" fill="#294a40">2026-10-15 分析图 · 历史资料与设计意图，非测绘 / 非游戏内提示</text></g></svg>
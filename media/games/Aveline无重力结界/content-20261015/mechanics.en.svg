<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="738" viewBox="0 0 1200 738"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#294a40"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1200" height="738" fill="#f0eee9"/><text x="42" y="40" font-size="18" fill="#294a40">AVELINE / SPATIAL DESIGN</text><text x="42" y="98" font-size="36" fill="#111614">Mechanics: rule → teaching → spatial use</text><rect x="42" y="148" width="58" height="48" fill="#dce66a"/><text x="52" y="181" font-size="25" fill="#111614">01</text><text x="122" y="178" font-size="27" fill="#294a40">Slope / connect walking planes</text><text x="122" y="218" font-size="23" fill="#111614">Teach a fixed curve, then carrying and placement. Current capacity: 3. Identity</text><text x="122" y="253" font-size="23" fill="#111614">and placement cues need testing.</text><rect x="42" y="280" width="58" height="48" fill="#dce66a"/><text x="52" y="313" font-size="25" fill="#111614">02</text><text x="122" y="310" font-size="27" fill="#294a40">Local field / move supported objects</text><text x="122" y="350" font-size="23" fill="#111614">Show object response first: short 2s, charged 6s. Player unaffected; latest valid</text><text x="122" y="385" font-size="23" fill="#111614">field wins, no force addition.</text><rect x="42" y="412" width="58" height="48" fill="#dce66a"/><text x="52" y="445" font-size="25" fill="#111614">03</text><text x="122" y="442" font-size="27" fill="#294a40">Beacon / switch player gravity</text><text x="122" y="482" font-size="23" fill="#111614">Reveal the landing before switching; check sightline, landing and camera. Archive</text><text x="122" y="517" font-size="23" fill="#111614">establishes the demonstration only.</text><rect x="42" y="544" width="58" height="48" fill="#dce66a"/><text x="52" y="577" font-size="25" fill="#111614">04</text><text x="122" y="574" font-size="27" fill="#294a40">Combination / transfer learned rules</text><text x="122" y="614" font-size="23" fill="#111614">Use taught actions in new problems; alternative solutions need cues, not</text><text x="122" y="649" font-size="23" fill="#111614">demonstrator knowledge.</text><rect x="42" y="680" width="1116" height="1" fill="#b4b9ad"/><text x="42" y="713" font-size="18" fill="#294a40">Analysis 2026-10-15 · Archive + design intent; not a survey or in-game UI</text></g></svg>
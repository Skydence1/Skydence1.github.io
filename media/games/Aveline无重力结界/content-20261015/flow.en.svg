<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#294a40"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1200" height="870" fill="#f0eee9"/><text x="42" y="40" font-size="18" fill="#294a40">AVELINE / SPATIAL DESIGN</text><text x="42" y="98" font-size="36" fill="#111614">Flow: five stages of understanding</text><rect x="42" y="148" width="58" height="48" fill="#dce66a"/><text x="52" y="181" font-size="25" fill="#111614">01</text><text x="122" y="178" font-size="27" fill="#294a40">01 / 00:00–02:31</text><text x="122" y="218" font-size="23" fill="#111614">Arrival and briefing → establish a reason to enter the anomaly.</text><rect x="42" y="280" width="58" height="48" fill="#dce66a"/><text x="52" y="313" font-size="25" fill="#111614">02</text><text x="122" y="310" font-size="27" fill="#294a40">02 / 02:31–05:53</text><text x="122" y="350" font-size="23" fill="#111614">Reveal, wall walking, slopes → see the goal and read a new floor.</text><rect x="42" y="412" width="58" height="48" fill="#dce66a"/><text x="52" y="445" font-size="25" fill="#111614">03</text><text x="122" y="442" font-size="27" fill="#294a40">03 / 05:53–09:25</text><text x="122" y="482" font-size="23" fill="#111614">Local field, first atrium visit → use object motion to reason about connections.</text><rect x="42" y="544" width="58" height="48" fill="#dce66a"/><text x="52" y="577" font-size="25" fill="#111614">04</text><text x="122" y="574" font-size="27" fill="#294a40">04 / 09:25–19:22</text><text x="122" y="614" font-size="23" fill="#111614">Outer exploration, transfer and revisit → recognize structures from a new</text><text x="122" y="649" font-size="23" fill="#111614">orientation.</text><rect x="42" y="676" width="58" height="48" fill="#dce66a"/><text x="52" y="709" font-size="25" fill="#111614">05</text><text x="122" y="706" font-size="27" fill="#294a40">05 / 19:22–20:45</text><text x="122" y="746" font-size="23" fill="#111614">Beacon, combined routes, crystal → combine rules and reach the goal.</text><rect x="42" y="812" width="1116" height="1" fill="#b4b9ad"/><text x="42" y="845" font-size="18" fill="#294a40">Analysis 2026-10-15 · Archive + design intent; not a survey or in-game UI</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="738" viewBox="0 0 1200 738"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#294a40"/></marker></defs><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1200" height="738" fill="#f0eee9"/><text x="42" y="40" font-size="18" fill="#294a40">AVELINE / SPATIAL DESIGN</text><text x="42" y="98" font-size="36" fill="#111614">Doors: trigger on player-body overlap</text><rect x="42" y="148" width="58" height="48" fill="#dce66a"/><text x="52" y="181" font-size="25" fill="#111614">01</text><text x="122" y="178" font-size="27" fill="#294a40">Issue · interaction range enters too early</text><text x="122" y="218" font-size="23" fill="#111614">The broad interaction sphere can arrive before the body, weakening perceived</text><text x="122" y="253" font-size="23" fill="#111614">causality.</text><rect x="42" y="280" width="58" height="48" fill="#dce66a"/><text x="52" y="313" font-size="25" fill="#111614">02</text><text x="122" y="310" font-size="27" fill="#294a40">Correction · filter ordinary-door overlaps</text><text x="122" y="350" font-size="23" fill="#111614">Character capsule enters → door opens. Exclude interaction sphere; check NPC</text><text x="122" y="385" font-size="23" fill="#111614">staging separately.</text><rect x="42" y="412" width="58" height="48" fill="#dce66a"/><text x="52" y="445" font-size="25" fill="#111614">03</text><text x="122" y="442" font-size="27" fill="#294a40">Evidence · October 14 local checks</text><text x="122" y="482" font-size="23" fill="#111614">Production-character traversal, stops and closing on exit; see door-capsule</text><text x="122" y="517" font-size="23" fill="#111614">report.</text><rect x="42" y="544" width="58" height="48" fill="#dce66a"/><text x="52" y="577" font-size="25" fill="#111614">04</text><text x="122" y="574" font-size="27" fill="#294a40">Open · does the player infer the cause?</text><text x="122" y="614" font-size="23" fill="#111614">The isolated sphere-overlap window and first-time comprehension remain unverified.</text><rect x="42" y="680" width="1116" height="1" fill="#b4b9ad"/><text x="42" y="713" font-size="18" fill="#294a40">Analysis 2026-10-15 · Archive + design intent; not a survey or in-game UI</text></g></svg>